<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StreetCraft — Turn one business opportunity into everything customers need to see. Google, Instagram, WhatsApp, and your counter, prepared together for physical businesses." />
    <title>StreetCraft — A Growth Engine for Physical Businesses</title>
    
    <!-- Synchronous Theme Bootstrap to Prevent Flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('streetcraft-theme');
          if (saved && (saved === 'paper' || saved === 'paper-dark' || saved === 'high-contrast')) {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'paper');
          }
        } catch(e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
